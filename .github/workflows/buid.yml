name: Build BONDVERSE EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Restore dependencies
      run: dotnet restore

    - name: Build project
      run: dotnet build --configuration Release

    - name: Publish EXE
      run: dotnet publish BONDVERSE.csproj -c Release -r win-x64 --self-contained true /p:PublishSingleFile=true

    - name: Upload EXE
      uses: actions/upload-artifact@v4
      with:
        name: BONDVERSE-EXE
        path: bin/Release/net8.0-windows/win-x64/publish/
